name: Stage reviewed DrumAtlas preview
on:
  push:
    branches: [development-v2]
    paths: [.github/workflows/stage-preview-20261017.yml]
permissions:
  contents: write
  actions: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 41d6356c4b99db319f47a004f9b58d291d294553
          persist-credentials: false
      - name: Require successful Mac validation and stage draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run watch 39024846421 --exit-status
          gh run download 39024846421 --dir artifacts
          cp DrumAtlas-dev-source.tar.gz DrumAtlas-Preview-20261017-2-Source.tar.gz
          cat > preview-notes.md <<'NOTES'
          Development preview of ongoing DrumAtlas 2.0 work. Not the completed specification.
          Adds aligned WAV stems, grouped or per track, at 44.1/48/96 kHz and 16/24 bit PCM, shared normalization gain and checksummed manifests. Includes previous Quick Beat features. Fixed two-second tail, one-shot/original synthesis only; no external VST bounce.
          Source revision: 9fa60de. Visible plugin version: 1.0.0.
          Mac: AU, VST3 and Standalone for Apple Silicon and Intel; serial activation endpoint configured. No Developer ID/notarization or real Logic Pro session test.
          Update over an existing installation; replaces DrumAtlas binaries. Back up DAW projects and close the DAW before installing. AI model weights are not included.
          Full instrument hosting, AI Chat, Sound Finder/Designer, advanced reference analysis and other specification items remain incomplete.
          Stable Update feed is unchanged. This preview is opt-in.
          NOTES
          gh release create v2.0.0-preview.20261017.2 --target 41d6356c4b99db319f47a004f9b58d291d294553 --draft --prerelease --title "DrumAtlas 1.0.0 — stem export preview 17 October 2026" --notes-file preview-notes.md DrumAtlas-Preview-20261017-2-Source.tar.gz artifacts/DrumAtlas-development-arm64/*.pkg artifacts/DrumAtlas-development-arm64/*.sha256 artifacts/DrumAtlas-development-x86_64/*.pkg artifacts/DrumAtlas-development-x86_64/*.sha256


