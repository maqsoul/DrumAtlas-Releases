name: DrumAtlas offline Synth Layers installers
on:
  workflow_dispatch:
  push:
    branches: [packaging-20261108]
    paths: [DrumAtlas-synth-source.tar.gz, .github/workflows/macos-synth.yml]
permissions:
  contents: read
  actions: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: juce-framework/JUCE
          ref: 9.0.3
          path: dependencies/JUCE
          persist-credentials: false
      - name: Extract current source
        run: |
          mkdir source
          tar -xzf DrumAtlas-synth-source.tar.gz -C source --strip-components=1
      - name: Assemble standalone offline Synth Layers
        run: |
          python3 source/Installer/build-synth-runtime.py --output models/SynthLayers --cache synth-cache
          models/SynthLayers/python/bin/python3 -I source/Installer/check-synth-runtime.py models/SynthLayers --device cpu --output models/SynthLayers/verification.json
          rm -rf synth-cache
      - name: Build AU, VST3, application and checks
        run: |
          cmake -S source -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DJUCE_DIR="$GITHUB_WORKSPACE/dependencies/JUCE" -DDRUMATLAS_TESTS=ON \
            -DDRUMATLAS_ACTIVATION_URL=https://drumatlas-activation.miras-maksat.workers.dev/v1/activate \
            -DDRUMATLAS_UPDATE_URL=https://raw.githubusercontent.com/maqsoul/DrumAtlas-Releases/main/stable.json
          cmake --build build --parallel 3 --target DrumAtlas_VST3 DrumAtlas_AU DrumAtlas_Standalone DrumAtlasEditTests DrumAtlasVisualMeterTests DrumAtlasSmoke
          ctest --test-dir build --output-on-failure -R '^(pitch-tempo-license|preview-visual-meter)$' --timeout 180
      - name: Verify reference and stem session recall
        run: |
          set -o pipefail
          DRUMATLAS_CACHE_DIR="$GITHUB_WORKSPACE/build/session-cache" \
            build/DrumAtlasSmoke_artefacts/Release/DrumAtlasSmoke --session "$GITHUB_WORKSPACE/build/session-fixtures" | tee build/session-recall.txt
      - name: Fetch shared models and decoder
        run: |
          python3 source/Installer/fetch-mac-models.py models
          python3 source/Installer/fetch-quality-models.py models
          python3 source/Installer/fetch-mac-decoder.py models ${{ matrix.arch }}
      - name: Reuse verified Intel ONNX runtime
        if: matrix.arch == 'x86_64'
        uses: actions/download-artifact@v8
        with:
          name: DrumAtlas-macOS-x86_64
          run-id: 42419737792
          github-token: ${{ github.token }}
          path: previous-package
      - name: Extract verified Intel runtime
        if: matrix.arch == 'x86_64'
        run: |
          pkgutil --expand-full previous-package/DrumAtlas-1.0.0-macOS-x86_64-Setup.pkg previous-expanded
          runtime=$(find previous-expanded -name libonnxruntime.dylib -type f | head -1)
          test -n "$runtime"
          cp "$runtime" models/libonnxruntime.dylib
          rm -rf previous-expanded previous-package
      - name: Verify model runtime architecture and loading
        run: |
          lipo models/libonnxruntime.dylib -verify_arch ${{ matrix.arch }}
          lipo models/libsndfile.dylib -verify_arch ${{ matrix.arch }}
          python3 - <<'PY'
          import ctypes,pathlib
          for name in ['libonnxruntime.dylib','libsndfile.dylib']:
              lib=ctypes.CDLL(str(pathlib.Path('models',name).resolve()))
              print('Loaded',name)
          PY
      - name: Package current full installer
        env:
          DRUMATLAS_BUILD_DIR: ${{ github.workspace }}/build
          DRUMATLAS_MODEL_DIR: ${{ github.workspace }}/models
        run: bash source/Installer/package-current-macos.sh
      - name: Validate installed Synth Layers and AU
        run: |
          sudo installer -pkg build/DrumAtlas-1.0.0-macOS-${{ matrix.arch }}-Setup.pkg -target /
          runtime="/Library/Application Support/DrumAtlas/Models/SynthLayers"
          "$runtime/python/bin/python3" -I source/Installer/check-synth-runtime.py "$runtime" --output build/synth-installed.json
          killall AudioComponentRegistrar 2>/dev/null || true
          validated=false
          for attempt in $(seq 1 20); do
            if auval -v aufx Da01 DAtl > build/auval.txt 2>&1; then
              if grep -q 'AU VALIDATION SUCCEEDED' build/auval.txt; then validated=true; break; fi
            fi
            sleep 3
          done
          cat build/auval.txt
          test "$validated" = true
      - uses: actions/upload-artifact@v7
        with:
          name: DrumAtlas-Synth-macOS-${{ matrix.arch }}
          path: |
            build/DrumAtlas-1.0.0-macOS-*-Setup.pkg
            build/*.sha256
            build/auval.txt
            build/synth-installed.json
            build/session-recall.txt
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: macOS-diagnostics-${{ matrix.arch }}
          path: |
            build/Testing/Temporary/LastTest.log
            build/CMakeFiles/CMakeConfigureLog.yaml
            models/SynthLayers/verification.json
            build/session-recall.txt
          retention-days: 7
